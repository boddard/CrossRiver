<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>F the Bus</title>
<meta name="theme-color" content="#14161b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="F the Bus">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-only, full-screen night-bus stage. Slim sign on top, four big cards in a 2x2 grid fill the middle, buttons dock at the bottom; the scoreboard sits below the fold. Wider screens get the same phone-width column. */
:root {
  --asphalt: #14161b;
  --panel: #1d2028;
  --line: #333845;
  --ink: #eef0f3;
  --muted: #9aa1ae;
  --bus: #f5b301;
  --bus-ink: #1a1505;
  --card: #f7f5ef;
  --card-ink: #1b1d22;
  --suit-red: #d93a3f;
  --ok: #46c46a;
  --miss: #ef5a5f;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --gutter: max(12px, env(safe-area-inset-left, 0px));
  --safe-y: calc(env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px));
  --pad-y: 10px;
  --sign-h: 48px;
  --gap: 12px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
/* Feel like an app, not a web page: no double-tap zoom, no text selection or long-press menus,
   no grey tap flash, no pull-to-refresh bounce. Typing still works in the name and code boxes. */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overscroll-behavior: none; background: var(--asphalt); }
body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
img, svg { -webkit-user-drag: none; }
button:active { transform: scale(.97); }
/* Built for thumbs after a few drinks: big targets, one obvious action per screen */
.choice { min-height: 76px; font-size: clamp(22px, 6vw, 28px); border-radius: 14px; }
.choice.suit { font-size: clamp(32px, 9vw, 42px); }
.primary { min-height: 60px; font-size: 24px; border-radius: 14px; padding: 14px 20px; }
.ghost { min-height: 48px; border-radius: 12px; font-size: 16px; }
.prompt { font-size: clamp(24px, 6.5vw, 30px); }
.turn-head { margin: 0; font: 900 clamp(34px, 10vw, 48px)/1 var(--display); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.turn-head.mine { color: var(--bus); }
.join-or { margin: 0; color: var(--muted); text-align: center; font-weight: 600; }
.code-row { display: flex; gap: 10px; }
.code-row input { flex: 1; min-width: 0; }
.code-row button { flex: none; width: 110px; }
.sheet-back { position: fixed; inset: 0; z-index: 55; background: rgba(8,9,12,.72); display: flex; align-items: flex-end; animation: fade .15s ease-out both; }
.sheet {
  width: 100%; max-width: 480px; margin: 0 auto; background: var(--panel); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 10px; max-height: 85dvh; overflow-y: auto; animation: rise .2s ease-out both;
}
.sheet .label { text-align: center; }
.sheet button { width: 100%; min-height: 56px; font-size: 18px; font-weight: 600; text-align: left; padding: 0 18px; }
.sheet button.danger { color: var(--miss); border-color: rgba(239,90,95,.5); }
.sheet button.armed-danger { background: var(--miss); color: #fff; border-color: var(--miss); }
.sheet details { border-top: 0; padding: 0 4px; }
.sheet .pax { padding: 0 2px; }
.sheet table { font-size: 15px; }
/* Drinks you owe: a card you have to clear with Done, and a badge on your bubble until you do */
.owe { position: absolute; top: -4px; left: -2px; z-index: 2; padding: 2px 5px; border-radius: 999px; background: var(--miss); color: #fff; font: 800 11px/1.2 var(--body); box-shadow: 0 0 0 2px var(--asphalt); animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
.drink-back { position: fixed; inset: 0; z-index: 52; background: rgba(8,9,12,.78); display: flex; align-items: flex-end; animation: fade .2s ease-out both; }
.drink-card {
  width: 100%; max-width: 480px; margin: 0 auto; display: grid; gap: 14px; text-align: center;
  padding: 22px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 22px) max(16px, env(safe-area-inset-left, 0px));
  background: var(--panel); border-top: 2px solid var(--miss); border-radius: 20px 20px 0 0; animation: rise .25s ease-out both;
}
.drink-card .big { font: 900 clamp(56px, 18vw, 84px)/.95 var(--display); text-transform: uppercase; color: var(--miss); }
.drink-why { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; color: var(--muted); font-weight: 600; }
.drink-card .primary { min-height: 72px; font-size: 28px; }
.install { display: grid; gap: 6px; padding: 12px 14px; border-radius: 10px; border: 1px dashed var(--line); background: var(--asphalt); }
.install b { font: 900 18px/1 var(--display); text-transform: uppercase; color: var(--bus); }
.install p { margin: 0; color: var(--muted); font-size: 14px; }
body {
  margin: 0;
  background: var(--asphalt);
  color: var(--ink);
  font: 16px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + var(--pad-y));
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
}
.wrap { max-width: 480px; margin: 0 auto; display: grid; gap: var(--gap); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--bus); outline-offset: 2px; }

/* Destination sign */
.sign {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: var(--sign-h); background: #0b0c0f; border: 2px solid var(--line); border-radius: 6px; padding: 0 14px; overflow: hidden;
}
.sign h1 {
  margin: 0; font: 900 30px/1 var(--display); letter-spacing: .02em; text-transform: uppercase;
  color: var(--bus); text-shadow: 0 0 14px rgba(245,179,1,.35);
}

.label { font: 600 12px/1.2 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* Status strip */
.stage { display: flex; flex-direction: column; gap: var(--gap); min-height: calc(100dvh - var(--safe-y) - 2 * var(--pad-y) - var(--sign-h) - var(--gap)); }
.status { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px 16px; }
.status > div:first-child { min-width: 0; }
.rider { font: 900 clamp(30px, 8vw, 44px)/1 var(--display); text-transform: uppercase; margin: 2px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meters { display: flex; gap: 18px; }
.meter { text-align: right; }
.meter strong { display: block; font: 700 22px/1.1 var(--mono); font-variant-numeric: tabular-nums; }

/* Cards: sized from both the screen width and the height left over after the bar, status and buttons */
/* Play screens are a fixed frame the size of the phone: player bar, headline, the table, and a control
   panel of fixed height. Only the contents of each area change, so nothing shifts and nothing scrolls. */
html.framed, html.framed body { overflow: hidden; height: 100%; }
html.framed body { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--pad-y)); }
.frame {
  height: calc(100dvh - var(--safe-y) - 2 * var(--pad-y) - var(--sign-h) - var(--gap));
  display: grid; grid-template-rows: auto 48px minmax(0, 1fr) 236px; gap: 10px;
}
.frame.race { grid-template-rows: auto 48px minmax(0, 1fr) 196px; }
.frame > .status { min-height: 0; align-items: center; }
.frame > .console { height: 100%; margin: 0; overflow-y: auto; align-content: center; }
.table-area { container-type: size; min-height: 0; display: grid; place-items: center; }
.route-line {
  --col-gap: 12px; --row-gap: 12px; --head: 30px;
  --cw: min(calc((100cqw - var(--col-gap)) / 2), calc((100cqh - var(--row-gap) - 2 * var(--head)) / 2 * 5 / 7));
  display: grid; grid-template-columns: repeat(2, var(--cw)); justify-content: center; align-content: center; gap: var(--row-gap) var(--col-gap);
}
.stop { display: grid; grid-template-rows: 22px auto; gap: 8px; justify-items: center; min-width: 0; container-type: inline-size; }
.stop-name .short { display: none; }
@container (max-width: 150px) { .stop-name .long { display: none; } .stop-name .short { display: inline; } }
.stop-head { display: flex; align-items: center; gap: 7px; min-width: 0; max-width: 100%; }
.dot { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--asphalt); border: 3px solid var(--line); display: grid; place-items: center; font: 700 10px var(--mono); color: var(--muted); }
.stop.on .dot { border-color: var(--bus); color: var(--bus); }
.stop.done .dot { background: var(--ok); border-color: var(--ok); color: var(--asphalt); }
.stop.bust .dot { background: var(--miss); border-color: var(--miss); color: var(--asphalt); }
.stop-name { font: 700 clamp(14px, 3.8vw, 19px)/1 var(--display); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.stop.on .stop-name { color: var(--ink); }

/* Cards */
.slot { width: 100%; max-width: 100%; aspect-ratio: 5 / 7; perspective: 900px; container-type: inline-size; transition: transform .25s ease-out; }
.stop.on .slot:not(.empty) .back { box-shadow: inset 0 0 0 3px var(--bus), 0 0 0 3px rgba(245,179,1,.25), 0 10px 30px rgba(245,179,1,.18); }
.card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2,.7,.2,1); }
.card.up { transform: rotateY(180deg); }
.card.deal { animation: deal .6s cubic-bezier(.2,.7,.2,1); }
@keyframes deal {
  0% { transform: translateY(-36px) scale(.9) rotateY(0deg); opacity: 0; }
  35% { transform: translateY(0) scale(1.04) rotateY(0deg); opacity: 1; }
  100% { transform: translateY(0) scale(1) rotateY(180deg); }
}
.face, .back { position: absolute; inset: 0; border-radius: 7cqw; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.back {
  background: repeating-linear-gradient(135deg, var(--bus) 0 10px, #e2a400 10px 20px);
  border: 3px solid #0b0c0f; box-shadow: inset 0 0 0 3px var(--bus);
}
.back::after { content: "BUS"; position: absolute; inset: 0; display: grid; place-items: center; font: 900 22cqw/1 var(--display); color: #0b0c0f; letter-spacing: .08em; }
.slot.empty .back { background: transparent; border: 2px dashed var(--line); box-shadow: none; }
.slot.empty .back::after { content: none; }
.face {
  transform: rotateY(180deg); background: var(--card); color: var(--card-ink);
  border: 1px solid #d9d5c8; display: grid; grid-template-rows: auto 1fr auto; padding: 6cqw 7cqw;
}
.face.red { color: var(--suit-red); }
.corner { font: 700 15cqw/1 var(--mono); letter-spacing: -.04em; }
.corner.bot { justify-self: end; transform: rotate(180deg); }
.pip { display: grid; place-items: center; font-size: 42cqw; line-height: 1; }
.slot.wrong .face { box-shadow: 0 0 0 3px var(--miss); }
.slot.right .face { box-shadow: 0 0 0 3px var(--ok); }

/* Controls */
.stage > .console { margin-top: auto; }
.console { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 14px; }
.prompt { margin: 0; font: 700 clamp(20px, 5vw, 26px)/1.15 var(--display); text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
.prompt .vs { color: var(--bus); }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.choices.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.choice {
  border: 2px solid var(--line); background: var(--asphalt); border-radius: 10px; padding: 8px; min-height: 62px;
  font: 700 clamp(17px, 4.6vw, 22px)/1 var(--display); text-transform: uppercase; letter-spacing: .04em;
  transition: border-color .15s, transform .1s;
}
@media (hover: hover) { .choice:hover { border-color: var(--bus); } }
.choice:active { transform: scale(.96); }
.choice.suit { font-size: clamp(26px, 7vw, 34px); padding: 10px 4px; }
.choice .r { color: var(--miss); }
.choice-red { border-color: rgba(239,90,95,.55); }
.verdict { display: grid; gap: 4px; }
.verdict .big { font: 900 clamp(34px, 10vw, 54px)/1 var(--display); text-transform: uppercase; }
.verdict.miss .big { color: var(--miss); }
.verdict.won .big { color: var(--bus); }
.verdict p { margin: 0; color: var(--muted); }
.primary {
  background: var(--bus); color: var(--bus-ink); border: 0; border-radius: 8px; padding: 14px 18px;
  font: 900 20px/1 var(--display); text-transform: uppercase; letter-spacing: .05em;
}
.primary:hover { filter: brightness(1.08); }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-weight: 600; color: var(--muted); }
.ghost:hover { color: var(--ink); border-color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.flash { margin: 0; font-weight: 600; }
.flash.ok { color: var(--ok); }

/* Passengers */
.pax { display: grid; gap: 8px; }
.pax-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font: 600 11px/1.2 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
th.n, td.n { text-align: right; font-family: var(--mono); }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); }
tr.current td { background: rgba(245,179,1,.08); }
tr.current td:first-child { box-shadow: inset 3px 0 0 var(--bus); }
.pname { font-weight: 600; }
.tag.off { background: var(--line); color: var(--muted); }
tr.is-off td { color: var(--muted); }
.tag { font: 700 10px/1 var(--mono); background: var(--bus); color: var(--bus-ink); padding: 3px 5px; border-radius: 3px; margin-left: 8px; vertical-align: 2px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

/* Setup */
.setup { display: grid; gap: 18px; }
.setup h2 { margin: 0; font: 900 28px/1 var(--display); text-transform: uppercase; }
.add { display: flex; gap: 8px; }
.add input {
  flex: 1; min-width: 0; background: var(--asphalt); color: var(--ink); border: 2px solid var(--line); border-radius: 8px;
  padding: 11px 12px; font: 500 16px var(--body);
}
.add button { flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
.chips li { display: flex; align-items: center; gap: 6px; background: var(--asphalt); border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 14px; font-weight: 600; }
.chips button { background: none; border: 0; width: 26px; height: 26px; border-radius: 50%; color: var(--muted); font-size: 16px; line-height: 1; }
.chips button:hover { background: var(--line); color: var(--ink); }
.opts { display: grid; gap: 10px; }
.modes { border: 0; margin: 0; padding: 0; display: grid; gap: 10px; }
.modes legend { padding: 0; margin-bottom: 8px; }
.mode { position: relative; display: block; cursor: pointer; }
.mode input { position: absolute; opacity: 0; pointer-events: none; }
.mode span { display: grid; gap: 4px; height: 100%; padding: 12px 14px; border: 2px solid var(--line); border-radius: 10px; background: var(--asphalt); transition: border-color .15s; }
.mode b { font: 900 20px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; }
.mode small { color: var(--muted); font-size: 13px; line-height: 1.35; }
.mode input:checked + span { border-color: var(--bus); box-shadow: 0 0 0 3px rgba(245,179,1,.18); }
.mode input:checked + span b { color: var(--bus); }
.mode input:focus-visible + span { outline: 2px solid var(--bus); outline-offset: 2px; }
.opt { display: flex; gap: 10px; align-items: flex-start; }
.opt input { width: 20px; height: 20px; accent-color: var(--bus); margin-top: 2px; flex: none; }
.opt span small { display: block; color: var(--muted); font-size: 13px; }

details { border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; font: 700 16px var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
details ol { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 6px; max-width: 65ch; }
details p { max-width: 65ch; color: var(--muted); }

.flip-btn { width: 100%; min-height: 62px; font-size: 24px; }
.flip-btn:active { transform: scale(.98); }
.meters { gap: 12px; }
/* Moments: a correct card pulses green, a miss shakes and flashes red, getting off throws confetti and drives a bus past */
.slot.hit .face { animation: hit .7s .45s ease-out both; }
@keyframes hit { 0% { box-shadow: 0 0 0 0 rgba(70,196,106,.9); } 100% { box-shadow: 0 0 0 18px rgba(70,196,106,0); } }
.slot.shake { animation: shake .5s .5s ease-in-out both; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px) rotate(-3deg); } 40% { transform: translateX(8px) rotate(2deg); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
.miss-flash { position: fixed; inset: 0; pointer-events: none; z-index: 20; background: radial-gradient(ellipse at center, transparent 40%, rgba(239,90,95,.45)); animation: flash .9s .45s ease-out both; }
@keyframes flash { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }
.slam { display: inline-block; animation: slam .45s .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes slam { 0% { transform: scale(2.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.stop.enter .slot { animation: rise .45s calc(var(--i) * 80ms) cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { 0% { transform: translateY(24px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.stop.cheer .slot { animation: cheer .6s calc(.5s + var(--i) * 90ms) ease-in-out both; }
@keyframes cheer { 0%, 100% { transform: none; } 40% { transform: translateY(-16px) rotate(-3deg); } 70% { transform: translateY(2px); } }
.rider.slide { animation: slide .45s cubic-bezier(.2,.7,.2,1) both; }
@keyframes slide { 0% { transform: translateX(-28px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.console.pop { animation: rise .35s .35s ease-out both; }
.fx-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 25; }
.fx-bus { position: fixed; left: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); width: 150px; z-index: 30; pointer-events: none; animation: drive 2.2s .4s cubic-bezier(.45,0,.55,1) both; }
.fx-bus g { animation: bob .22s ease-in-out infinite alternate; }
@keyframes drive { 0% { transform: translateX(-170px); } 100% { transform: translateX(calc(100vw + 20px)); } }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-2px); } }

/* Horse race: a vertical track. Sideline cards run up the left; four lanes, finish at the top */
.track {
  --rgap: 4px;
  --row: min(72px, calc((100cqh - (var(--rows) - 1) * var(--rgap) - 14px) / var(--rows)));
  width: min(100cqw, 520px);
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0 8px; align-content: center;
}
.tcol { position: relative; display: grid; grid-template-rows: repeat(var(--rows), var(--row)); gap: var(--rgap); }
.tcell { border-radius: 6px; display: grid; place-items: center; min-width: 0; }
.tcell.lane { background: linear-gradient(90deg, transparent 46%, var(--line) 46%, var(--line) 54%, transparent 54%); opacity: .55; }
.tcell.finish { background: repeating-conic-gradient(var(--ink) 0 25%, var(--asphalt) 0 50%) 0 0 / 12px 12px; opacity: .3; }
.tcell.gate { border: 2px dashed var(--line); }
.tcell.flag { font: 700 clamp(11px, 3vw, 14px)/1 var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.mini { height: 100%; width: min(100%, calc(var(--row) * 5 / 7)); perspective: 500px; container-type: inline-size; }
.mini-face { display: grid; place-items: center; align-content: center; padding: 0; font: 700 34cqw/1 var(--mono); }
.mini-face span { font-size: 44cqw; line-height: 1; }
.mini .back::after, .draw-slot .back::after { font-size: 22cqw; }
.horse {
  position: absolute; left: 50%; bottom: 0; height: var(--row); width: min(100%, calc(var(--row) * 5 / 7));
  container-type: inline-size; border-radius: 6px; background: var(--card); color: var(--card-ink); border: 1px solid #d9d5c8;
  transform: translateX(-50%) translateY(calc(var(--p) * -1 * (var(--row) + var(--rgap))));
  transition: transform .5s cubic-bezier(.3,1.35,.5,1); box-shadow: 0 6px 16px rgba(0,0,0,.35);
}

}

.waiting { margin: 0; color: var(--muted); font-weight: 500; }

.mode-read { padding: 12px 14px; border: 2px solid var(--line); border-radius: 10px; background: var(--asphalt); }

/* Reactions and callouts float up every phone */
.floats { position: fixed; inset: 0; pointer-events: none; z-index: 45; overflow: hidden; }

@keyframes floatup { 0% { transform: translate(-50%, 20px) scale(.6); opacity: 0; } 12% { transform: translate(-50%, 0) scale(1.1); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(-50%, -55vh) scale(1); opacity: 0; } }

/* Full-screen callouts: YOUR TURN, KIM DRINKS!, HURRY UP! */
.takeover { position: fixed; inset: 0; z-index: 48; pointer-events: none; display: grid; place-items: center; padding: 0 16px; background: radial-gradient(ellipse at center, rgba(0,0,0,.55), rgba(0,0,0,.15) 70%); }
.takeover span { font: 900 clamp(48px, 16vw, 92px)/.95 var(--display); text-transform: uppercase; text-align: center; text-wrap: balance; color: var(--bus); text-shadow: 0 4px 0 #000, 0 0 40px rgba(245,179,1,.5); }

.takeover.show span { animation: slam .45s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes takeover { 0% { opacity: 0; } 8% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }

/* Suspense: the rider's call hangs on every screen before the card turns */
.console.calling { text-align: center; justify-items: center; }
.call-by { margin: 0; color: var(--muted); font-weight: 600; }
.call { margin: 0; font: 900 clamp(40px, 12vw, 60px)/1 var(--display); text-transform: uppercase; color: var(--bus); animation: slam .35s cubic-bezier(.2,1.6,.4,1) both; }
.drum { display: flex; gap: 8px; }
.drum span { width: 10px; height: 10px; border-radius: 50%; background: var(--bus); animation: drum .5s ease-in-out infinite alternate; }
.drum span:nth-child(2) { animation-delay: .15s; } .drum span:nth-child(3) { animation-delay: .3s; }
@keyframes drum { from { transform: translateY(0); opacity: .4; } to { transform: translateY(-8px); opacity: 1; } }


/* The bus moves on by itself: a bar runs down until the next rider's turn */
.autopass { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.autopass span { display: block; height: 100%; background: var(--bus); transform-origin: left; animation: drain var(--ms) linear forwards; }
@keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.nudge-hint { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }

/* End-of-night awards */
.awards { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.award { display: grid; gap: 4px; padding: 14px 16px; border-radius: 12px; background: var(--asphalt); border: 1px solid var(--line); animation: rise .5s calc(var(--i) * 120ms) cubic-bezier(.2,.7,.2,1) both; }
.award strong { font: 900 28px/1 var(--display); text-transform: uppercase; color: var(--bus); }
.award:first-child { border-color: var(--bus); }

/* Swipe to flip: drag sideways and the card turns over with your finger. Let go and it finishes turning
   at the speed you swiped; every other phone sees the same turn, live. */
.slot.armed, .slot.calling, .draw-slot.armed, .draw-slot.calling { touch-action: none; }
.slot.armed .card, .slot.calling .card, .draw-slot.armed .card, .draw-slot.calling .card {
  transform: rotateY(var(--rot, 0deg)); transition: transform var(--rt, 90ms) linear;
}
.dragging .card { transition: none !important; }
html.swipe-turn, html.swipe-turn body { touch-action: none; }
.slot.armed, .draw-slot.armed { cursor: grab; }
.slot.armed .back, .draw-slot.armed .back { box-shadow: inset 0 0 0 3px var(--bus), 0 0 0 3px rgba(245,179,1,.35), 0 0 30px rgba(245,179,1,.35); }
.swipe-hint { position: absolute; left: 50%; bottom: -4px; transform: translate(-50%, 100%); white-space: nowrap; font: 700 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--bus); animation: nudgex 1.2s ease-in-out infinite; pointer-events: none; }
.slot, .draw-slot { position: relative; }
@keyframes nudgex { 0%, 100% { transform: translate(-50%, 100%); } 25% { transform: translate(calc(-50% - 7px), 100%); } 75% { transform: translate(calc(-50% + 7px), 100%); } }
/* The face lands in the direction and at the speed of the swipe */
.card.swipe-in { animation: swipein var(--spd, 260ms) cubic-bezier(.25,.7,.35,1) both; }
@keyframes swipein { from { transform: rotateY(calc(var(--dir, 1) * 84deg)); } to { transform: rotateY(calc(var(--dir, 1) * 180deg)); } }
.choice.picked { border-color: var(--bus); background: rgba(245,179,1,.14); color: var(--bus); }
.flip-row { display: flex; gap: 10px; align-items: center; }
.flip-row .ghost { flex: none; }

/* Horse race: backers ride on their horse, your lane is tinted, horses jump and stumble */
.tcol.mine { --lanec: var(--c); }
.tcell.lane { background: linear-gradient(90deg, transparent 46%, var(--lanec, var(--line)) 46%, var(--lanec, var(--line)) 54%, transparent 54%); }
.riders { position: absolute; left: 50%; top: calc(100% + 2px); transform: translateX(-50%); display: flex; gap: 1px; pointer-events: none; }
.rdot { width: 11px; height: 11px; border-radius: 50%; background: var(--c); color: #111; font: 800 7px/11px var(--body); text-align: center; box-shadow: 0 0 0 1px var(--asphalt); }
.horse.leader { box-shadow: 0 0 0 2px var(--bus), 0 6px 16px rgba(0,0,0,.35); }

@keyframes gallop { 0% { transform: translateY(0); } 35% { transform: translateY(-12px) rotate(-8deg); } 70% { transform: translateY(2px) rotate(3deg); } 100% { transform: none; } }

@keyframes stumble { 0%, 100% { transform: none; } 20% { transform: rotate(14deg) translateX(4px); } 50% { transform: rotate(-10deg); } 80% { transform: rotate(5deg); } }
.deck-row { display: flex; align-items: center; gap: 12px; min-height: 84px; }
.deck-row .draw-slot { width: 60px; }
.flipper-line { margin: 0; font-weight: 600; }
.flipper-line b { color: var(--bus); }

.busy :is([data-g], #pass, #skip, #flip, #start, #start-race, #race-again) { opacity: .55; pointer-events: none; }
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); z-index: 60; transform: translateX(-50%);
  width: min(440px, calc(100% - 32px)); padding: 12px 16px; border-radius: 10px;

<body>
<div class="wrap">
  <header class="sign" aria-label="F the Bus">

      <button class="sign-btn icon" id="more" type="button" aria-label="Menu" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>
  <main id="app"></main>

<script>
(() => {
  const SUITS = [
    { key: "S", sym: "♠", name: "Spades", red: false },
    { key: "H", sym: "♥", name: "Hearts", red: true },
    { key: "D", sym: "♦", name: "Diamonds", red: true },
    { key: "C", sym: "♣", name: "Clubs", red: false },
  ];
  const SUIT_KEYS = ["S", "H", "D", "C"];
  const MODES = {
    classic: { name: "Classic", blurb: "Red or black, higher or lower, inside or outside, then the suit.", dots: ["1", "2", "3", "4"],
      stops: [["Red / Black", "Red/Blk"], ["Higher / Lower", "Hi/Lo"], ["Inside / Outside", "In/Out"], ["Suit", "Suit"]] },
    hilo: { name: "Higher or Lower", blurb: "Get 3 higher-or-lower calls right in a row.", dots: ["S", "1", "2", "3"],
      stops: [["Start card", "Start"], ["Guess 1", "Guess 1"], ["Guess 2", "Guess 2"], ["Guess 3", "Guess 3"]] },
    horse: { name: "Horse Race", blurb: "Bet on an ace and take turns flipping cards to race them up the track." },
  };
  const REACTIONS = ["🍺", "😂", "🔥", "😱", "👏", "🤮"];
  const CALLS = { red: "Red", black: "Black", higher: "Higher", lower: "Lower", inside: "Inside", outside: "Outside", S: "♠ Spades", H: "♥ Hearts", D: "♦ Diamonds", C: "♣ Clubs" };
  const REVEAL_MS = 450;  // the card hangs nearly edge-on this long before the face lands
  const EDGE = 84;        // degrees: how far a swiped card turns before the server answers
  const SWIPE_PX = 70;    // how far a card must be pushed up to flip it
  const STORE = "fthebus.online.v1";

  const app = document.getElementById("app");
  // S is the room state the server last sent; the server is the only source of truth.
  let S = null, me = null, ws = null, connected = false, retry = 0, retryTimer = null;
  let fx = "", dealt = -1, lastSeq = null, confirming = false, toastTimer = null;
  let pendingTimer = null, lastMsgAt = 0, wasMyTurn = false, wasMyFlip = false;
  let suspense = null;   // the server has answered; everyone holds on the call for REVEAL_MS
  let armed = null;      // the call I've picked and am about to swipe for
  let remote = null;     // the rider's (or flipper's) call and live swipe, seen from another phone
  let trayOpen = false, trayTimer = null, prevPos = null;
  let sheetOpen = false, sheetRules = false, leaveArmed = false;
  let oweReadyAt = 0;
  let lastSwipe = null;   // { dir, spd, at }: how the latest card was swiped, so the face lands the same way
  let pendingFlip = null; // my swipe is done and sent; hold the card edge-on until the answer arrives  // the Drink card waits until the reveal and callouts have played
  const TITLE = document.title;
  const calm = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Name, room, seat token and mute survive reloads so a phone that locks rejoins its seat.
  let session = { name: "", room: "", token: "", muted: false };
  try { Object.assign(session, JSON.parse(localStorage.getItem(STORE)) || {}); } catch (e) {}
  const saveSession = () => { try { localStorage.setItem(STORE, JSON.stringify(session)); } catch (e) {} };
  const linkRoom = (new URLSearchParams(location.search).get("room") || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  if (linkRoom && linkRoom !== session.room) { session.room = ""; session.token = ""; }

  // ---- helpers ----
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const suitOf = c => SUITS.find(s => s.key === c.s);
  const suitSym = k => SUITS.find(s => s.key === k).sym;
  const suitName = k => SUITS.find(s => s.key === k).name;
  const isRed = k => k === "H" || k === "D";
  const label = c => c.r + suitOf(c).sym;
  const mode = () => S.settings.mode;
  const hilo = () => mode() === "hilo";
  const horse = () => mode() === "horse";
  const byId = id => S.players.find(p => p.id === id);
  const amHost = () => S && S.hostId === me;
  const nameOf = id => { const p = byId(id); return p ? esc(p.name) : "Someone"; };
  const plainName = id => { const p = byId(id); return p ? p.name : "Someone"; };
  const youTag = id => id === me ? ' <span class="tag you">YOU</span>' : "";
  const initial = name => (Array.from(String(name).trim())[0] || "?").toUpperCase();
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const buzz = pattern => { try { navigator.vibrate && navigator.vibrate(pattern); } catch (e) {} };

  // ---- sound: small synthesized effects, no audio files ----
  let ac = null;
  function audio() {
    if (session.muted) return null;
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(freq, dur, type = "sine", vol = .18, at = 0, slide) {

    // its element (keyed by the card itself), so a reaction or reconnect arriving mid-animation doesn't restart it.
    const ev = S.ev, landed = !v.revealing && (["good", "miss", "won"].includes(ev.type) || (ev.type === "turn" && ev.dealt === 0)) ? ev.dealt : -1;
    if (c) {
      const s = suitOf(c);
      const bust = v.phase === "miss" && i === v.stage;
      slotCls.push(bust ? "wrong shake" : (v.phase === "won" ? "right" : ""));
      if (ev.type === "good" && i === landed) slotCls.push("hit");
      face = `<div class="face${s.red ? " red" : ""}" aria-hidden="true">
        <span class="corner">${c.r}${s.sym}</span><span class="pip">${s.sym}</span><span class="corner bot">${c.r}${s.sym}</span></div>`;
    }
    // A swiped card lands the way it was swiped; a dealt one (Higher or Lower's start card) drops in.
    const sw = recentSwipe(), swiped = i === landed && ev.call && sw;
    const cardCls = c ? (i === landed ? (swiped ? "card up swipe-in" : "card deal up") : "card up") : "card";
    const cardStyle = swiped ? ` style="--dir:${sw.dir};--spd:${sw.spd}ms"` : "";
    const key = c ? ` data-key="k${i}${c.r}${c.s}"` : "";
    const aria = c ? `${c.r === "A" ? "Ace" : c.r} of ${suitOf(c).name}` : slotCls.includes("armed") ? "Your card. Swipe it sideways to flip it" : "Face-down card";
    const hint = slotCls.includes("armed") && !pendingFlip ? '<span class="swipe-hint">← Swipe anywhere →</span>' : "";
    return `<div class="${slotCls.filter(Boolean).join(" ")}"${extra} role="img" aria-label="${aria}"><div class="${cardCls}"${key}${cardStyle}><div class="back"></div>${face}</div>${hint}</div>`;
  }
  function stopsHTML(v) {
    return `<div class="table-area"><section class="route-line" aria-label="The four cards">${MODES[mode()].stops.map((name, i) => {
      let cls = "stop" + (S.ev.type === "turn" ? " enter" : S.ev.type === "won" && !v.revealing ? " cheer" : "");
      if (v.phase === "miss" && i === v.stage) cls += " bust";

  function choicesHTML(v) {

    if (hilo()) return { prompt: `${v.stage === 3 ? "Last one. " : ""}Higher or lower than <span class="vs">${esc(label(r[v.stage - 1]))}</span>?`, choices: two("higher", "lower", "Higher ↑", "Lower ↓") };
    if (v.stage === 0) return { prompt: "Red or black?", choices: two("red", "black", '<span class="r">Red</span>', "Black", true) };
    if (v.stage === 1) return { prompt: `Higher or lower than <span class="vs">${esc(label(r[0]))}</span>?`, choices: two("higher", "lower", "Higher ↑", "Lower ↓") };
    if (v.stage === 2) return { prompt: `Inside or outside <span class="vs">${esc(label(r[0]))}</span> and <span class="vs">${esc(label(r[1]))}</span>?`, choices: two("inside", "outside", "Inside", "Outside") };
    return { prompt: "Pick the suit to get off", choices: `<div class="choices four">${SUITS.map(s => `<button class="choice suit${picked(s.key)}" data-g="${s.key}" aria-label="${s.name}">${s.red ? `<span class="r">${s.sym}</span>` : s.sym}</button>`).join("")}</div>` };
  }
  function consoleHTML(v) {
    const p = byId(S.current);

    if (v.revealing || (v.call && !mine)) {

  }
  function betsTableHTML() {

  function paxHTML() {

    </section>`;

  function playHTML() {
    const v = view();

    return `${confirmHTML()}${layer("")}<div class="frame">

  // ---- horse race ----
  const leader = r => SUIT_KEYS.reduce((a, k) => r.pos[k] > r.pos[a] ? k : a, "S");
  function miniFace(c) { return c ? `<div class="face mini-face${suitOf(c).red ? " red" : ""}">${c.r}<span>${suitOf(c).sym}</span></div>` : ""; }
  function raceStatusHTML(r) {
    const lead = leader(r), tie = SUIT_KEYS.filter(k => r.pos[k] === r.pos[lead]).length > 1;
    const head = r.winner ? `${suitSym(r.winner)} ${suitName(r.winner)} win` : r.flips === 0 ? "They're at the gate" : tie ? "Neck and neck" : `${suitSym(lead)} ${suitName(lead)} lead`;
    return `<div><span class="label">Room ${esc(S.code)} · Horse Race · ${r.len} cards</span><p class="rider">${head}</p></div>
      <div class="meters"><div class="meter"><span class="label">Flips</span><strong>${r.flips}</strong></div></div>`;
  }
  function trackHTML(r) {
    const myBet = byId(me) && byId(me).bet;
    const lead = r.flips ? leader(r) : null;
    let side = `<div class="tcol side"><div class="tcell flag">Finish</div>`;
    for (let k = r.len; k >= 1; k--) {
      side += `<div class="tcell"><div class="mini" data-side="${k}"><div class="card${r.sideUp[k - 1] ? " up" : ""}"><div class="back"></div>${miniFace(r.side[k - 1])}</div></div></div>`;
    }
    side += `<div class="tcell flag">Start</div></div>`;
    const lanes = SUIT_KEYS.map(k => {
      let cells = `<div class="tcell finish"></div>`;
      for (let i = 0; i < r.len; i++) cells += `<div class="tcell lane"></div>`;
      cells += `<div class="tcell gate"></div>`;
      const cls = ["horse", isRed(k) ? "red" : "", r.winner === k ? "winner" : "", !r.winner && lead === k ? "leader" : ""].filter(Boolean).join(" ");
      const riders = S.players.filter(p => p.bet && p.bet.suit === k).slice(0, 4)
        .map(p => `<span class="rdot" style="--c:${p.color}" title="${esc(p.name)}">${esc(initial(p.name))}</span>`).join("");
      const mine = myBet && myBet.suit === k;
      return `<div class="tcol${mine ? " mine" : ""}"${mine ? ` style="--c:${byId(me).color}"` : ""}>${cells}<div class="${cls}" data-h="${k}" style="--p:${r.pos[k]}" aria-label="Ace of ${suitName(k)}, spot ${r.pos[k]}"><div class="hface">A<span>${suitSym(k)}</span></div><div class="riders">${riders}</div></div></div>`;
    }).join("");
    return `<div class="table-area"><section class="track" id="track" style="--rows:${r.len + 2}" aria-label="Race track">${side}${lanes}</section></div>`;
  }
  function raceConsoleHTML(r) {
    if (r.winner) {
      const res = (r.results || []).map(x => `<li class="${x.won ? "win" : "lose"}"><b>${esc(x.name)}</b>${youTag(x.id)} backed <span class="${isRed(x.suit) ? "r" : ""}">${suitSym(x.suit)}</span> for ${x.amt}
        <span class="pay">${x.won ? `hand out ${x.amt * 2}` : `drink ${x.amt}`}</span></li>`).join("");
      return `<section class="console race-console" aria-live="polite">
        <div class="verdict won"><span class="big${fx === "won" ? " slam" : ""}">${suitSym(r.winner)} ${esc(suitName(r.winner))} win</span>
          <p>Crossed the line after ${r.flips} flips. Losers drink their bet. Winners hand out double: tap players at the top.</p></div>
        <ul class="payouts">${res}</ul>
        ${amHost() ? '<div class="row"><button class="primary" id="race-again">Race again</button><button class="ghost" id="to-menu">Change game</button></div>'
          : `<p class="waiting">Waiting for <b>${nameOf(S.hostId)}</b> to start the next race.</p>`}
      </section>`;
    }
    const f = byId(r.flipper), myFlip = r.flipper === me;
    const watching = remote && remote.by === r.flipper;
    const rot = myFlip ? (pendingFlip ? pendingFlip.dir * EDGE : 0) : watching ? remote.dir * Math.min(1, remote.p) * EDGE : 0;
    const rt = myFlip ? (pendingFlip ? pendingFlip.t : 0) : watching ? remote.t || 90 : 0;
    const deck = `<div class="draw-slot ${myFlip ? "armed" : "calling"}" id="swipe-card" style="--rot:${rot}deg;--rt:${rt}ms" role="img" aria-label="${myFlip ? "The deck. Swipe it sideways to flip a card" : "The deck"}">
      <div class="card" data-key="d${r.flips}"><div class="back"></div></div>${myFlip && !pendingFlip ? '<span class="swipe-hint">← Swipe anywhere →</span>' : ""}</div>`;
    const sw = recentSwipe(), fresh = fx === "flip" || fx === "won";
    const last = r.last ? `<div class="draw-slot"><div class="card up${fresh ? (sw ? " swipe-in" : " deal") : ""}" data-key="f${r.flips}"${fresh && sw ? ` style="--dir:${sw.dir};--spd:${sw.spd}ms"` : ""}><div class="back"></div>${miniFace(r.last)}</div></div>` : "";
    const who = myFlip ? "<b>Your flip!</b> Swipe across the screen."
      : f && !f.connected && amHost() ? `<b>${esc(f.name)}</b> is offline.` : `<b>${f ? esc(f.name) : "Someone"}</b> is flipping…`;
    const button = myFlip ? '<button class="primary flip-btn" id="flip">Flip a card</button>'

      <div class="deck-row">${deck}${last}<div style="min-width:0"><p class="flipper-line">${who}</p><p class="race-msg" aria-live="polite">${esc(r.msg)}</p></div></div>

  }
  function raceHTML() {

  // After a flip, the horse that moved jumps; the one knocked back stumbles.
  function animateHorses() {
    const r = S && S.screen === "race" && S.race;
    if (!r) { prevPos = null; return; }

      ${rulesHTML()}
    </section>`;
  }

  // ---- end of night ----
  // Party awards. Each one only shows when someone actually earned it.
  function awardsHTML() {
    const P = S.players;
    const pick = (fn, { min = 1, low = false, eligible = () => true } = {}) => {
      const pool = P.filter(eligible);
      if (!pool.length) return null;
      const vals = pool.map(fn), best = low ? Math.min(...vals) : Math.max(...vals);
      if (!low && !(best >= min)) return null;
      return { who: pool.filter(p => fn(p) === best), val: best };
    };
    const names = a => a.who.map(p => esc(p.name)).join(" & ");
    const secs = ms => ms < 60000 ? `${Math.round(ms / 1000)}s` : `${Math.floor(ms / 60000)}m ${Math.round((ms % 60000) / 1000)}s`;
    const avgDone = p => p.drankTimes ? p.drankMs / p.drankTimes : 0;
    const played = p => p.drinks > 0 || p.guesses > 0 || p.won > 0;
    const awards = [];
    const add = (emoji, title, a, stat, who) => { if (a) awards.push({ emoji, title, who: who || names(a), stat: stat(a.val) }); };

    // The drinking
    add("🏆", "Liver of steel", pick(p => p.drinks), v => `${plural(v, "drink")} tonight`);
    add("🪶", "Lightweight", P.filter(played).length > 1 ? pick(p => p.drinks, { low: true, eligible: played }) : null, v => `only ${plural(v, "drink")}`);
    add("⚡", "Chugger", pick(avgDone, { low: true, eligible: p => p.drankTimes >= 2 }), v => `tapped Done in ${secs(v)} on average`);
    add("🐌", "Still holding it", pick(avgDone, { min: 15000, eligible: p => p.drankTimes >= 1 }), v => `took ${secs(v)} on average to drink up`);
    const owing = P.filter(p => p.owe > 0);
    if (owing.length) awards.push({ emoji: "🚨", title: "Still owes", who: owing.map(p => esc(p.name)).join(" & "), stat: owing.map(p => `${esc(p.name)}: ${plural(p.owe, "drink")}`).join(", ") });

    // The bus
    add("🚌", "Bus driver", pick(p => p.maxTries, { min: 3 }), v => `${v} tries before getting off`);
    add("🎯", "Sniper", pick(p => p.oneShots), v => `off the bus first try ${plural(v, "time")}`);
    add("🔥", "Hot hand", pick(p => p.bestRun, { min: 3 }), v => `${v} calls right in a row`);
    add("💀", "Cursed", pick(p => p.worstStreak, { min: 3 }), v => `${v} misses in a row`);
    add("🎰", "Degenerate gambler", pick(p => p.lost, { min: 2 }), v => `lost ${plural(v, "drink")} on horse bets`);

    // The beef
    const grudge = (S.grudges || []).filter(g => byId(g.from) && byId(g.to)).sort((a, b) => b.n - a.n)[0];
    if (grudge && grudge.n >= 2) awards.push({ emoji: "😤", title: "Grudge match", who: `${nameOf(grudge.from)} → ${nameOf(grudge.to)}`, stat: `${plural(grudge.n, "drink")} handed over` });
    add("🥊", "Punching bag", pick(p => p.taken, { min: 2 }), v => `was handed ${plural(v, "drink")}`);
    add("🍻", "Bartender", pick(p => p.given, { min: 2 }), v => `poured out ${plural(v, "drink")}`);

    const list = awards.map((a, i) => `<li class="award" style="--i:${i}"><span class="label">${a.emoji} ${a.title}</span>
      <strong>${a.who}</strong><span class="hint">${a.stat}</span></li>`).join("");
    return `${confirmHTML()}<section class="console setup">
      ${crewHTML()}
      <h2>End of the night</h2>
      ${list ? `<ul class="awards">${list}</ul>` : '<p class="waiting">Play a few rounds first and the awards will show up here.</p>'}
      ${amHost() ? '<div class="row"><button class="primary" id="to-menu">Back to the lobby</button><button class="ghost" id="new-night">Start a new night</button></div>'
        : `<p class="waiting">Waiting for <b>${nameOf(S.hostId)}</b>.</p>`}
    </section>`;
  }

  // ---- shared ----
  function rulesHTML() {
    const tail = `Aces are ${S.settings.acesHigh ? "high" : "low"}. A tie with the card you're comparing against ${S.settings.tiesMiss ? "counts as a miss" : "is a free pass"}.`;
    if (horse()) return `<details><summary>House rules: Horse Race</summary><ol>
      <li>Everyone backs one of the four aces and bets 1 to 5 drinks.</li>
      <li>Players take turns flipping a card from the deck. The ace of that suit moves forward one spot.</li>
      <li>Once every ace has reached a sideline card, that card turns over and the ace of its suit drops back one spot.</li>
      <li>The first ace past the last sideline card wins.</li></ol>
      <p>Losers drink what they bet. Winners hand out double their bet to anyone they like.</p></details>`;
    const off = `Get off the bus and you hand out ${plural(S.giveOnOff, "drink")}, then sit out until everyone else is off.`;
    if (hilo()) return `<details><summary>House rules: Higher or Lower</summary>
      <p>Each turn starts with a free card dealt face up. Call higher or lower, then swipe the next card up to flip it. Get 3 right in a row and you're off the bus.</p>
      <p>Every miss is 1 drink, and the bus moves on to the next player by itself. ${off} ${tail}</p></details>`;
    return `<details><summary>House rules: Classic</summary><ol>
      <li><b>Red or black.</b></li>
      <li><b>Higher or lower</b> than card 1.</li>
      <li><b>Inside or outside</b> cards 1 and 2.</li>
      <li><b>Pick the suit.</b> Hit it and you're off the bus.</li></ol>
      <p>Make your call, then swipe the card up to flip it. Every miss is 1 drink, and the bus moves on to the next player by itself. ${off} ${tail}</p></details>`;
  }
  // Overlays sit in fixed slots so showing or hiding one never shifts the page below it.
  const layer = html => `<div class="layer">${html}</div>`;
  // Everything that isn't the game itself lives in one menu, away from the big buttons.
  function sheetHTML() {
    if (!sheetOpen || !S) return layer("");
    const host = amHost();
    return layer(`<div class="sheet-back" id="sheet-back"><div class="sheet" role="dialog" aria-modal="true" aria-label="Menu">
      <span class="label">Room ${esc(S.code)} · ${MODES[mode()].name}</span>
      ${S.screen === "play" ? paxHTML() : S.screen === "race" && S.race ? betsTableHTML() : ""}
      <button class="ghost" id="invite">Invite friends</button>
      <button class="ghost" id="rules-toggle" aria-expanded="${sheetRules}">How to play</button>
      ${sheetRules ? rulesHTML().replace("<details>", "<details open>") : ""}
      ${host && S.screen !== "lobby" ? '<button class="ghost" id="to-menu">Change game</button>' : ""}
      ${host && S.screen !== "awards" ? '<button class="ghost" id="show-awards">End of night awards</button>' : ""}
      ${host ? '<button class="ghost danger" id="restart-ask">Restart for everyone</button>' : ""}
      <button class="ghost ${leaveArmed ? "armed-danger" : "danger"}" id="leave">${leaveArmed ? "Tap again to leave" : "Leave room"}</button>
      <button class="primary" id="sheet-close">Back to the game</button>
    </div></div>`);
  }
  // Your drinks: stays up until you tap Done. Everyone else sees a badge on your bubble meanwhile.
  function drinkHTML() {
    const mine = S && byId(me);
    if (!mine || mine.owe < 1 || suspense || Date.now() < oweReadyAt) return layer("");
    const why = mine.oweLog.map(x => `<li>${x.why === "From" ? `From ${nameOf(x.from)}` : esc(x.why)}${x.n > 1 ? ` ×${x.n}` : ""}</li>`).join("");
    return layer(`<div class="drink-back"><div class="drink-card" role="dialog" aria-modal="true" aria-label="Drink ${mine.owe}">
      <span class="big">Drink ${mine.owe}</span>
      <ul class="drink-why">${why}</ul>
      <button class="primary" id="drank">Done 🍺</button>
    </div></div>`);
  }
  function confirmHTML() {
    if (!confirming) return layer("") + sheetHTML() + drinkHTML();
    const what = horse()
      ? "Everyone's drink totals and stats go back to zero and the room goes back to the betting screen."
      : "Everyone's drinks, stats and best rides go back to zero, and a new round starts from the top of the list.";
    return layer(`<div class="confirm-back"><div class="confirm" role="dialog" aria-modal="true" aria-labelledby="rs-title">
        <h2 id="rs-title">Restart the game?</h2><p>${what} This restarts it for the whole room.</p>
        <div class="row"><button class="primary" id="restart-yes">Restart</button><button class="ghost" id="restart-no">Keep playing</button></div>
      </div></div>`) + sheetHTML() + layer("");
  }

  let lastScreen = null;
  function render() {
    // A new screen (lobby to game, game to awards) starts at the top; updates within a screen keep their place.
    const screen = S ? S.screen : "join";
    if (screen !== lastScreen) { lastScreen = screen; scrollTo(0, 0); }
    document.documentElement.classList.toggle("framed", screen === "play" || (screen === "race" && !!S.race));
    document.documentElement.classList.toggle("swipe-turn", !!canSwipe());
    paint(!S ? joinHTML()
      : S.screen === "lobby" ? lobbyHTML()
      : S.screen === "bets" ? betsHTML()
      : S.screen === "race" && S.race ? raceHTML()
      : S.screen === "awards" ? awardsHTML()
      : playHTML());
    document.getElementById("more").hidden = !S;
    animateHorses();
    if (fx === "won") celebrate();
    fx = ""; dealt = -1;
    if (confirming) document.getElementById("restart-yes").focus();
    banner();
  }

  async function invite() {
    const url = `${location.origin}${location.pathname}?room=${S.code}`;
    const text = `Join my F the Bus game. Room code ${S.code}`;
    try { if (navigator.share) { await navigator.share({ title: "F the Bus", text, url }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(url); toast("Invite link copied. Paste it in the group chat."); }
    catch (e) { toast(`Send your friends this link: ${url}`); }
  }

  // ---- swipe to flip ----
  // Drag the card sideways and it turns with your finger (up to nearly edge-on). Let go past halfway, or
  // flick it, and it finishes at your swipe's speed; the face then lands at that same speed. Let go early
  // and it springs back. The turn is shared live so everyone watches it.
  let drag = null, lastDragSent = 0;
  const canSwipe = () => S && !pendingFlip && ((S.screen === "play" && S.current === me && S.phase === "guess" && armed && !suspense)
    || (S.screen === "race" && S.race && !S.race.winner && S.race.flipper === me));
  function sendTurn(p, dir, extra = {}, force = false) {
    const now = Date.now();
    if (!force && now - lastDragSent < 60) return;
    lastDragSent = now;
    send({ t: "drag", p, dir, g: S.screen === "play" ? armed : undefined, ...extra }, true);
  }
  // angVel: degrees per millisecond at release (a default for the Flip button).
  function commitFlip(dir = 1, angVel = .35, p = 0) {
    if (!canSwipe()) return;
    const v = Math.max(angVel, .06);
    const t = Math.round(Math.min(380, Math.max(60, EDGE * (1 - p) / v)));
    const spd = Math.round(Math.min(560, Math.max(140, (180 - EDGE) / v)));
    pendingFlip = { dir, t };
    lastSwipe = { dir, spd, at: Date.now() };
    const el = document.getElementById("swipe-card");
    if (el) {
      el.classList.remove("dragging");
      el.style.setProperty("--rt", `${t}ms`);
      el.style.setProperty("--rot", `${dir * EDGE}deg`);
      const hint = el.querySelector(".swipe-hint"); if (hint) hint.remove();
    }
    sfx.flip();
    sendTurn(1, dir, { spd, t }, true);
    if (S.screen === "play") act("guess", { g: armed }); else act("flip");
  }
  // Full-screen swipe: start anywhere that isn't a button, and the card turns as the finger moves.
  // Half the screen's width turns it edge-on, and at that point it flips over by itself.
  const halfWidth = () => Math.max(120, innerWidth / 2);
  document.addEventListener("pointerdown", e => {
    if (!canSwipe() || e.button > 0) return;
    if (e.target.closest("button, input, a, label, .crew, .sheet, .drink-card, .confirm, .tray")) return;
    const el = document.getElementById("swipe-card");
    if (!el) return;
    audio();
    drag = { el, x: e.clientX, id: e.pointerId, p: 0, dir: 1, pts: [{ x: e.clientX, t: performance.now() }] };
    el.classList.add("dragging");
  });
  document.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x;
    drag.dir = dx < 0 ? -1 : 1;
    drag.p = Math.min(1, Math.abs(dx) / halfWidth());
    drag.pts.push({ x: e.clientX, t: performance.now() });
    if (drag.pts.length > 8) drag.pts.shift();
    if (drag.p >= 1) {
      // Halfway across the screen: flip it now, at the speed the finger was moving.
      const d = drag; drag = null;
      return commitFlip(d.dir, releaseSpeed(d), 1);
    }
    drag.el.style.setProperty("--rot", `${drag.dir * drag.p * EDGE}deg`);
    sendTurn(drag.p, drag.dir);
  });
  // Degrees per millisecond, from the last ~100ms of finger movement.
  function releaseSpeed(d) {
    const now = performance.now(), recent = d.pts.filter(pt => now - pt.t < 110);
    const a = recent[0] || d.pts[0], b = d.pts[d.pts.length - 1];
    const pxPerMs = b.t > a.t ? Math.abs(b.x - a.x) / (b.t - a.t) : 0;
    return pxPerMs / halfWidth() * EDGE;
  }
  const endDrag = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    d.el.classList.remove("dragging");
    d.el.style.setProperty("--rt", "220ms");
    d.el.style.setProperty("--rot", "0deg");
    sendTurn(0, d.dir, { t: 220 }, true);
  };
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);

  // ---- events ----
  app.addEventListener("click", e => {
    const t = e.target.closest("button");
    if (trayOpen && !e.target.closest(".crew")) { trayOpen = false; render(); }
    if (!t || t.disabled) return;
    audio(); keepAwake();
    if (t.dataset.g) {
      // Picking a call doesn't flip anything yet: it arms the card for a swipe and tells the room.
      if (!(S.screen === "play" && S.current === me && S.phase === "guess") || suspense || pendingFlip) return;
      armed = t.dataset.g; sfx.pop();
      send({ t: "drag", p: 0, g: armed }, true);
      return render();
    }
    if (t.dataset.rx) {
      send({ t: "react", e: +t.dataset.rx });
      // Leave the tray open for a burst of reactions, then tuck it away.
      clearTimeout(trayTimer); trayTimer = setTimeout(() => { if (trayOpen) { trayOpen = false; render(); } }, 3000);
      return;
    }
    if (t.dataset.bub) {
      const id = t.dataset.bub, mine = byId(me);
      if (mine && mine.give > 0 && id !== me) return act("give", { to: id });
      const riderId = S.screen === "play" && S.phase === "guess" ? S.current : S.screen === "race" && S.race && !S.race.winner ? S.race.flipper : null;
      if (id === riderId && id !== me) return send({ t: "nudge", to: id });
      return;
    }
    if (t.dataset.bs) return act("setBet", { suit: t.dataset.bs });
    if (t.dataset.ba) return act("setBet", { delta: +t.dataset.ba });
    if (t.dataset.kick) return act("kick", { id: t.dataset.kick });
    switch (t.id) {
      case "create": {
        const name = (document.getElementById("name").value || "").trim();
        if (!name) { toast("Enter your name first."); return document.getElementById("name").focus(); }
        session.name = name; saveSession();
        return send({ t: "hello", create: true, name });
      }
      case "nocode": history.replaceState(null, "", location.pathname); return location.reload();
      case "forget": leaveLocal(); return;
      case "invite": return invite();
      case "install": if (installPrompt) { installPrompt.prompt(); installPrompt.userChoice.finally(() => { installPrompt = null; render(); }); } return;
      case "leave":
        if (!leaveArmed) { leaveArmed = true; return render(); }
        leaveArmed = false; sheetOpen = false; return send({ t: "leave" });
      case "drank": sfx.gulp(); buzz(60); return act("drank");
      case "sheet-close": sheetOpen = false; leaveArmed = false; return render();
      case "rules-toggle": sheetRules = !sheetRules; return render();
      case "restart-ask": sheetOpen = false; confirming = true; return render();
      case "start": return act("start");
      case "react-toggle": trayOpen = !trayOpen; return render();
      case "restart-yes": confirming = false; return act("restart");
      case "restart-no": confirming = false; return render();
      case "flip-now": return commitFlip(1, .3);
      case "skip": return act("skip");
      case "start-race": return act("startRace");
      case "race-again": return act("raceAgain");
      case "to-menu": sheetOpen = false; return act("menu");
      case "show-awards": sheetOpen = false; return act("awards");
      case "new-night": return act("restart");
      case "flip": return S.race && S.race.flipper === me ? commitFlip(1, .3) : act("flip");
      case "len-down": return act("setTrackLen", { delta: -1 });
      case "len-up": return act("setTrackLen", { delta: 1 });
    }
  });
  app.addEventListener("submit", e => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const code = document.getElementById("code").value.toUpperCase().replace(/[^A-Z]/g, "");
    if (!name) { toast("Enter your name first."); return document.getElementById("name").focus(); }
    if (code.length !== 4) { toast("Room codes are 4 letters."); return document.getElementById("code").focus(); }
    session.name = name; saveSession();
    send({ t: "hello", room: code, name });
  });
  app.addEventListener("change", e => {
    if (e.target.name === "mode") return act("setMode", { mode: e.target.value });
    if (e.target.id === "aces") return act("setSetting", { key: "acesHigh", value: e.target.checked });
    if (e.target.id === "ties") return act("setSetting", { key: "tiesMiss", value: e.target.checked });
  });
  document.getElementById("more").addEventListener("click", () => { audio(); sheetOpen = !sheetOpen; leaveArmed = false; render(); });
  // Tapping the dark area around the menu closes it.
  app.addEventListener("click", e => { if (e.target.id === "sheet-back") { sheetOpen = false; leaveArmed = false; render(); } });
  document.getElementById("sound").addEventListener("click", () => { session.muted = !session.muted; saveSession(); soundIcon(); if (!session.muted) sfx.pop(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && (confirming || trayOpen || sheetOpen)) { confirming = false; trayOpen = false; sheetOpen = false; render(); }
  });

  // ---- celebration ----
  function celebrate() {
    if (calm()) return;
    const bus = document.createElement("div");
    bus.innerHTML = `<svg class="fx-bus" viewBox="0 0 150 64" aria-hidden="true"><g>
      <rect x="4" y="6" width="138" height="44" rx="9" fill="#f5b301" stroke="#0b0c0f" stroke-width="3"/>
      <rect x="14" y="13" width="20" height="15" rx="2" fill="#0b0c0f"/><rect x="40" y="13" width="20" height="15" rx="2" fill="#0b0c0f"/>
      <rect x="66" y="13" width="20" height="15" rx="2" fill="#0b0c0f"/><rect x="92" y="13" width="20" height="15" rx="2" fill="#0b0c0f"/>
      <rect x="120" y="13" width="16" height="22" rx="2" fill="#0b0c0f"/><rect x="4" y="34" width="112" height="4" fill="#0b0c0f"/>
      <circle cx="32" cy="52" r="10" fill="#0b0c0f"/><circle cx="32" cy="52" r="4" fill="#9aa1ae"/>
      <circle cx="112" cy="52" r="10" fill="#0b0c0f"/><circle cx="112" cy="52" r="4" fill="#9aa1ae"/></g></svg>`;
    const svg = bus.firstElementChild;
    document.body.appendChild(svg);
    setTimeout(() => svg.remove(), 3000);
    const c = document.createElement("canvas");
    c.className = "fx-canvas";
    document.body.appendChild(c);
    const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext("2d"); g.scale(dpr, dpr);
    const colors = ["#f5b301", "#46c46a", "#f7f5ef", "#ef5a5f", "#e2a400"];
    const bits = Array.from({ length: 150 }, () => ({
      x: W / 2 + (Math.random() - .5) * W * .3, y: H * .5,
      vx: (Math.random() - .5) * 16, vy: -(Math.random() * 15 + 7),
      w: 6 + Math.random() * 6, h: 4 + Math.random() * 4,
      r: Math.random() * 6, vr: (Math.random() - .5) * .4, col: colors[Math.floor(Math.random() * colors.length)],
    }));
    const t0 = performance.now() + 450;
    (function frame(now) {
      if (now < t0) return requestAnimationFrame(frame);
      const t = now - t0;
      g.clearRect(0, 0, W, H);
      g.globalAlpha = t > 1600 ? Math.max(0, 1 - (t - 1600) / 600) : 1;
      for (const b of bits) {
        b.vy += .45; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
        g.save(); g.translate(b.x, b.y); g.rotate(b.r); g.fillStyle = b.col; g.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); g.restore();
      }
      if (t < 2200) requestAnimationFrame(frame); else c.remove();
    })(performance.now());
  }

  // iOS Safari still pinch-zooms despite the viewport setting; stop two-finger gestures here.
  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener("dblclick", e => e.preventDefault());
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

  soundIcon();
  render();
  connect();
})();
</script>
</body>
</html>
